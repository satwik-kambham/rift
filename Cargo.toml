[workspace]
resolver = "3"

members = [
  "crates/rift_core",
  "crates/rift_io",
  "crates/rift_highlight",
  "crates/rift_tui",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/satwik-kambham/rift"
authors = ["Satwik Kambham"]
publish = false

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

bitflags = "2.11.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52.2", features = ["full"] }

[workspace.metadata.crane]
name = "rift-workspace"
